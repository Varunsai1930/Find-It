[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "findit"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.1",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "requests==2.33.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.0",
    "fastapi==0.141.1",
    "starlette==1.7.0",
    "uvicorn==0.52.1",
    "jinja2==3.1.6",
    "httpx==0.28.1",
]

[project.scripts]
findit = "findit.cli.__main__:main"

[project.optional-dependencies]
download = ["playwright==1.63.0"]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.5",
    "httpx2==2.13.0",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "python tools/prepare_vercel_release.py"

# Startup fingerprints read these files even when the platform serves them
# from its CDN. Keep their source directory in the function bundle.
[tool.vercel.fastapi.static]
exclude = false

# Only the package: a checkout also holds git-ignored data folders
# (real_data/) that flat-layout discovery would otherwise pick up.
[tool.setuptools.packages.find]
include = ["findit*"]

[tool.setuptools.package-data]
"findit.web" = ["templates/*.html", "static/*"]
"findit.ingest" = ["amfi_amcs.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]
